Different commands to perform with the pods:
1. kubectl get pods
2. kubectl describe pod <podname>
3. kubectl logs <podname> -c <containername> or just run kubectl logs for help
4. kubectl exec -it <podname> -- /bin/bash
5. kubectl delete pod <podname>

Example output:
kubectl delete pod authentication
pod "authentication" deleted

kubectl get pods
